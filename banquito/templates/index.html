<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Banquito</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f5f5f5;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 { font-size: clamp(3rem, 12vw, 5rem); margin: 1rem 0 2rem; }
    select, button { font-size: 1.1rem; padding: 0.6rem 1rem; border-radius: 0.5rem; }
    button { background: #f5b301; border: 0; cursor: pointer; font-weight: bold; }
    #question { font-size: 1.6rem; margin-top: 2.5rem; line-height: 1.4; }
    #question.error { color: #ff6b6b; }

    /* Modo picante (easter egg) */
    body.spicy { background: #2b0a0a; }
    body.spicy button#next { background: #e63946; color: #fff; }
    #corner {
      position: fixed; left: 0; bottom: 0;
      width: 44px; height: 44px;
      padding: 0; border: 0; background: none; cursor: pointer;
      transition: width .25s ease, height .25s ease;
    }
    #corner:hover, #corner:focus-visible, body.spicy #corner { width: 130px; height: 130px; }
    #corner .red, #corner .flap { position: absolute; inset: 0; }
    /* Triángulo rojo que queda al descubierto (abajo a la izquierda) */
    #corner .red {
      background: #d62828;
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }
    #corner svg { position: absolute; left: 6%; bottom: 6%; width: 55%; height: 55%; }
    /* Solapa de la esquina doblada (arriba a la derecha) */
    #corner .flap {
      background: linear-gradient(135deg, #bbb, #eee 60%, #fff);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, .6));
    }
  </style>
</head>
<body>
  <h1>El Banquito</h1>

  <select id="category" aria-label="Categoría"></select>
  <button id="next">Siguiente pregunta</button>

  <p id="question"></p>

  <button id="corner" type="button" aria-label="Modo picante" aria-pressed="false">
    <span class="red"></span>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M20 24 C 15 18, 13 14, 9 11" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M18 24 C 30 14, 52 30, 57 46 C 58 53, 52 55, 46 53 C 30 49, 11 39, 18 24 Z" fill="#43a047" stroke="#1b5e20" stroke-width="3" stroke-linejoin="round"/>
      <path d="M26 28 C 34 28, 44 36, 48 44" stroke="#a5d6a7" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="flap"></span>
  </button>

  <script>
    const CATEGORIES = {{ categories|tojson }};
    const output = document.getElementById("question");
    const select = document.getElementById("category");
    const corner = document.getElementById("corner");
    let mode = "normal";

    {% if static %}
    // Versión estática (GitHub Pages): las preguntas van embebidas en la página.
    const QUESTIONS = {{ questions|tojson }};

    async function getQuestion(category) {
      const slugs = category
        ? [category]
        : Object.keys(CATEGORIES).filter((s) => CATEGORIES[s].mode === mode);
      const pool = slugs.flatMap((s) => QUESTIONS[s]);
      return pool[Math.floor(Math.random() * pool.length)];
    }
    {% else %}
    async function getQuestion(category) {
      const params = new URLSearchParams();
      if (category) params.set("category", category);
      else params.set("mode", mode);
      const response = await fetch("/question/?" + params);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      return data.question;
    }
    {% endif %}

    function renderCategories() {
      select.replaceChildren(new Option("Todas las categorías", ""));
      for (const [slug, info] of Object.entries(CATEGORIES)) {
        if (info.mode === mode) select.append(new Option(info.label, slug));
      }
    }

    // Easter egg: la esquina inferior izquierda activa/desactiva el modo picante.
    corner.addEventListener("click", () => {
      mode = mode === "normal" ? "picante" : "normal";
      document.body.classList.toggle("spicy", mode === "picante");
      corner.setAttribute("aria-pressed", mode === "picante");
      output.textContent = "";
      renderCategories();
    });

    document.getElementById("next").addEventListener("click", async () => {
      output.classList.remove("error");
      try {
        output.textContent = await getQuestion(select.value);
      } catch (e) {
        output.classList.add("error");
        output.textContent = "No se pudo cargar la pregunta. Inténtalo de nuevo.";
      }
    });

    renderCategories();
  </script>
</body>
</html>
